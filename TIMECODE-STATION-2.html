<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIMECODE STATION 2</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TC STATION">
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #14161c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --panel: #1e222b;
    --panel2: #262b36;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #4fd1a5;
    --accent2: #6aa9ff;
    --danger: #ff6b6b;
    --border: #333a47;
  }
  * { box-sizing: border-box; }
  html { height: -webkit-fill-available; }
  body {
    margin: 0;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    padding: calc(24px + var(--safe-top)) 12px calc(24px + var(--safe-bottom));
    -webkit-user-select: none;
    user-select: none;
  }
  input { -webkit-user-select: text; user-select: text; }
  @media (max-width: 420px) {
    .panel { padding: 14px; }
    button { min-width: 84px; padding: 12px 16px; }
    .keypad { grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .keypad button { padding: 12px 0; font-size: 16px; min-width: 0; }
  }
  .wrap { width: 100%; max-width: 760px; }
  header.title { text-align: center; margin: 0 0 20px; }
  h1 {
    font-size: clamp(22px, 5.5vw, 36px);
    font-weight: 800;
    letter-spacing: 5px;
    margin: 0;
    background: linear-gradient(90deg, #4fd1a5 0%, #6aa9ff 55%, #b48aff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(79, 209, 165, .28));
  }
  h1 .ver {
    margin-left: 0.25em;
    -webkit-text-fill-color: transparent; /* タイトルと同じグラデーションを共有 */
  }
  header.title .sub {
    display: block;
    margin-top: 7px;
    font-size: 10px;
    letter-spacing: 6px;
    color: var(--muted);
  }
  header.title .rule {
    width: 220px; max-width: 70%;
    height: 1px;
    margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
  }

  /* ストップウォッチ */
  .tc-display {
    font-size: clamp(32px, 11vw, 72px);
    font-weight: 700;
    text-align: center;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    padding: 18px 8px;
    background: var(--panel2);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .tc-display .frames { color: var(--accent); }
  .tc-display.running { text-shadow: 0 0 24px rgba(79, 209, 165, .35); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit;
    font-size: 16px;
    padding: 12px 22px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    cursor: pointer;
    transition: filter .15s, transform .05s;
    min-width: 110px;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #10241d; font-weight: 700; border-color: transparent; }
  button.danger  { background: var(--danger); color: #2b1111; font-weight: 700; border-color: transparent; }
  button.secondary { min-width: 60px; padding: 12px 14px; }

  .opts {
    display: flex; gap: 14px; align-items: center; justify-content: center;
    margin-top: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap;
  }
  select {
    font-family: inherit; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
  }

  /* ラップ */
  .laps { margin-top: 14px; max-height: 180px; overflow-y: auto; }
  .lap {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 6px 10px; font-size: 14px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .lap b { color: var(--text); font-weight: 600; }
  .lap .split { color: var(--accent2); }

  /* 電卓 */
  .calc-note { color: var(--muted); font-size: 12px; margin: 0 0 12px; line-height: 1.7; }
  .calc-note code { color: var(--accent2); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  #calcDisplay {
    width: 100%;
    font-family: inherit;
    font-size: 20px;
    text-align: right;
    padding: 12px 14px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .keypad button { min-width: 0; padding: 14px 0; font-size: 17px; }
  .keypad .op { color: var(--accent2); font-weight: 700; }
  .keypad .eq { background: var(--accent); color: #10241d; font-weight: 700; }
  .keypad .clear { color: var(--danger); }
  .calc-history {
    margin-top: 12px; max-height: 150px; overflow-y: auto;
    font-size: 13px; color: var(--muted);
  }
  .calc-history div { padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .calc-history b { color: var(--accent); font-weight: 600; }

  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <h1>TIMECODE STATION<span class="ver">Ⅱ</span></h1>
    <span class="sub">STOPWATCH × TIMECODE CALCULATOR</span>
    <div class="rule"></div>
  </header>

  <!-- ストップウォッチ -->
  <div class="panel">
    <div class="tc-display" id="display">00:00:00<span class="frames">:00</span></div>
    <div class="row" style="margin-top:14px;">
      <button class="primary" id="startBtn">スタート</button>
      <button id="lapBtn" disabled>ラップ</button>
      <button class="danger" id="resetBtn" disabled>リセット</button>
    </div>
    <div class="opts">
      <label>フレームレート:
        <select id="fpsSelect">
          <option value="24">24 fps</option>
          <option value="25">25 fps</option>
          <option value="30">30 fps</option>
          <option value="29.97" selected>29.97 fps (drop frame)</option>
          <option value="60">60 fps</option>
        </select>
      </label>
      <label><input type="checkbox" id="dropCheck" checked> DF (ドロップフレーム)</label>
    </div>
    <div class="laps" id="laps"></div>
  </div>

  <!-- 電卓 -->
  <div class="panel">
    <input id="calcDisplay" type="text" spellcheck="false" autocomplete="off" inputmode="none" placeholder="00:01:30:00 + 45s × 2">
    <div class="keypad" id="keypad"></div>
    <div class="calc-history" id="calcHistory"></div>
  </div>

  <footer>フレームは内部で高精度 (performance.now) に計算しています</footer>
</div>

<script>
"use strict";

/* ===================== タイムコード変換 ===================== */

function fpsInfo() {
  const fps = parseFloat(document.getElementById("fpsSelect").value);
  const df = document.getElementById("dropCheck").value !== undefined && document.getElementById("dropCheck").checked && fps === 29.97;
  return { fps, nominal: fps === 29.97 ? 30 : fps, drop: df };
}

// ドロップフレーム: 毎分 2フレーム除外 (ただし 10分ごと)
// DF秒 → 経過フレーム数
// --- SMPTE ドロップフレーム変換 (標準アルゴリズム) ---
// nominal: 表示レート (30) / 実レートは 29.97
// 戻り値は「表示カウント」(ドロップ補正済み)。表示は nominal で単純分解できる
function secondsToFramesDF(sec, nominal) {
  const real = nominal * 0.999;          // 29.97
  const dropFrames = 2;
  const per10 = nominal * 600;           // 18000
  const perMin = nominal * 60;           // 1800
  let fn = Math.round(sec * real);       // 実フレーム数
  const d = Math.floor(fn / per10);
  const m = fn % per10;
  fn += (m > dropFrames)
    ? dropFrames * 9 * d + dropFrames * Math.floor(m / perMin)
    : dropFrames * 9 * d;
  return fn;
}

function framesToSecondsDF(count, nominal) {
  const real = nominal * 0.999;          // 29.97
  const dropFrames = 2;
  const per10 = nominal * 600;           // 18000
  const perMin = nominal * 60;           // 1800
  const d = Math.floor(count / per10);
  const m = count % per10;
  let fn;
  if (m > dropFrames) {
    fn = count - dropFrames * 9 * d - dropFrames * Math.floor((m - dropFrames) / perMin);
  } else {
    fn = count - dropFrames * 9 * d;
  }
  return fn / real;
}

function secondsToTC(sec) {
  const { fps, nominal, drop } = fpsInfo();
  sec = Math.max(0, sec);
  // DF: ドロップ補正済みの表示カウント / 非DF: 実フレーム数 (fps === nominal)
  const f = drop ? secondsToFramesDF(sec, nominal) : Math.round(sec * fps);
  const ff = f % nominal;
  const totalSec = Math.floor(f / nominal);
  const ss = totalSec % 60;
  const mm = Math.floor(totalSec / 60) % 60;
  const hh = Math.floor(totalSec / 3600);
  const p = n => String(n).padStart(2, "0");
  return { hh: p(hh), mm: p(mm), ss: p(ss), ff: p(ff), frames: f };
}

function tcToSeconds(tc) {
  const { fps, nominal, drop } = fpsInfo();
  const m = tc.trim().match(/^(\d+):(\d{1,2}):(\d{1,2})[;:.](\d{1,3})$/);
  if (m) {
    const [, hh, mm, ss, ff] = m;
    const frames = (+hh * 3600 + +mm * 60 + +ss) * nominal + +ff; // 「表示上の」フレーム数
    return drop ? framesToSecondsDF(frames, nominal) : frames / fps;
  }
  const s = tc.trim().match(/^([\d.]+)\s*s$/i);
  if (s) return parseFloat(s[1]);
  return null;
}

function renderTC(sec) {
  const tc = secondsToTC(sec);
  document.getElementById("display").innerHTML =
    `${tc.hh}:${tc.mm}:${tc.ss}<span class="frames">:${tc.ff}</span>`;
  document.getElementById("display").classList.toggle("running", running);
}

/* ===================== ストップウォッチ ===================== */

let running = false;
let startTime = 0;      // performance.now()
let elapsed = 0;        // 停止中の累積 (秒)
let rafId = null;

const startBtn = document.getElementById("startBtn");
const lapBtn = document.getElementById("lapBtn");
const resetBtn = document.getElementById("resetBtn");

function currentElapsed() {
  return elapsed + (running ? (performance.now() - startTime) / 1000 : 0);
}

function tick() {
  renderTC(currentElapsed());
  rafId = requestAnimationFrame(tick);
}

startBtn.addEventListener("click", () => {
  if (running) {
    elapsed = currentElapsed();
    running = false;
    cancelAnimationFrame(rafId);
    startBtn.textContent = "スタート";
    startBtn.classList.add("primary");
    lapBtn.disabled = true;
  } else {
    startTime = performance.now();
    running = true;
    tick();
    startBtn.textContent = "ストップ";
    startBtn.classList.remove("primary");
    lapBtn.disabled = false;
  }
  resetBtn.disabled = false;
  renderTC(currentElapsed());
});

lapBtn.addEventListener("click", () => {
  const sec = currentElapsed();
  const tc = secondsToTC(sec);
  const row = document.createElement("div");
  row.className = "lap";
  const n = document.querySelectorAll(".lap").length + 1;
  const prev = lapBtn._last || 0;
  const split = secondsToTC(sec - prev);
  lapBtn._last = sec;
  row.innerHTML = `<span>#${n}</span><b>${tc.hh}:${tc.mm}:${tc.ss}:${tc.ff}</b>` +
    `<span class="split">+${split.hh}:${split.mm}:${split.ss}:${split.ff}</span>`;
  document.getElementById("laps").prepend(row);
});

resetBtn.addEventListener("click", () => {
  running = false;
  cancelAnimationFrame(rafId);
  elapsed = 0;
  lapBtn._last = 0;
  startBtn.textContent = "スタート";
  startBtn.classList.add("primary");
  lapBtn.disabled = true;
  resetBtn.disabled = true;
  document.getElementById("laps").innerHTML = "";
  renderTC(0);
});

document.getElementById("fpsSelect").addEventListener("change", () => renderTC(currentElapsed()));
document.getElementById("dropCheck").addEventListener("change", () => renderTC(currentElapsed()));

/* ===================== 電卓 ===================== */

const display = document.getElementById("calcDisplay");
const history = document.getElementById("calcHistory");

const keys = [
  ["7","8","9",":","⌫","C"],
  ["4","5","6","+","*","h"],
  ["1","2","3","-","/","m"],
  ["0","s","f","=","",""],
];
const keypad = document.getElementById("keypad");
keys.flat().forEach(k => {
  if (k === "") return;
  const b = document.createElement("button");
  b.textContent = k;
  b.className = "secondary" +
    (["+","-","*","/","×","÷"].includes(k) ? " op" : "") +
    (k === "=" ? " eq" : "") +
    (k === "C" ? " clear" : "");
  b.addEventListener("click", () => pressKey(k));
  keypad.appendChild(b);
});

function pressKey(k) {
  if (k === "C") { display.value = ""; display.focus(); return; }
  if (k === "⌫") { display.value = display.value.slice(0, -1); display.focus(); return; }
  if (k === "=") { evaluate(); return; }
  const val = k === "−" ? "-" : k;
  const s = display.selectionStart ?? display.value.length;
  display.value = display.value.slice(0, s) + val + display.value.slice(display.selectionEnd ?? s);
  display.focus();
  display.setSelectionRange(s + val.length, s + val.length);
}

function displayFps() {
  const { fps, nominal, drop } = fpsInfo();
  return drop ? nominal : fps; // 1フレームあたりの描画面のfps
}

// 複合単位 "1m2s15f" "5s20f" "1h30m" を秒に変換
function durationToSeconds(str) {
  const re = /(\d+(?:\.\d+)?)\s*([hmsf])/gi;
  const fp = displayFps();
  let sec = 0, hit = false, m;
  while ((m = re.exec(str)) !== null) {
    hit = true;
    const v = parseFloat(m[1]);
    switch (m[2].toLowerCase()) {
      case "h": sec += v * 3600; break;
      case "m": sec += v * 60;   break;
      case "s": sec += v;        break;
      case "f": sec += v / fp;   break;
    }
  }
  return hit ? sec : null;
}

// トークン分割: タイムコード / 複合単位 / 単一単位 / スカラー / 演算子
function tokenize(str) {
  const tokens = [];
  const re = /\s*(\d+:\d{1,2}:\d{1,2}[;:.]\d{1,3}|(?:\d+(?:\.\d+)?\s*[hmsf]\s*)+|\d+(?:\.\d+)?|[-+×÷*/])\s*/gi;
  str = str.replace(/[ー−–—]/g, "-");
  let m;
  while ((m = re.exec(str)) !== null) tokens.push(m[1].trim());
  return tokens;
}

const isOp = t => /^[+\-×÷*/]$/.test(t);

function evaluate() {
  const tokens = tokenize(display.value);
  if (!tokens.length) return;

  // 値 (秒) と演算子の交互列として評価
  // 文法: 値 (op 値)*   op ∈ {+,-,×,÷}   値の後の ×/÷ は右辺がスカラーのときのみ有効
  let i = 0;
  let err = null;
  let acc = parseValue(tokens[i++]);
  if (acc === null) { showError(); return; }

  while (i < tokens.length && !err) {
    let op, v;
    if (isOp(tokens[i])) {
      op = tokens[i++];
      v = parseValue(tokens[i++]);
      if (v === null) { err = true; break; }
    } else {
      op = "+";                       // 演算子を挟まず値が続いたら加算 (1m2s15f など)
      v = parseValue(tokens[i++]);
      if (v === null) { err = true; break; }
    }
    switch (op) {
      case "+": acc += v; break;
      case "-": case "−": acc -= v; break;
      case "×": case "*": acc *= v; break;
      case "÷": case "/":
        if (v === 0) { err = "0で割れません"; } else acc /= v;
        break;
      default: err = true;
    }
    if (err) break;
  }

  if (err !== null) {
    history.prepend(makeHist(display.value, err === true ? "式エラー" : err, true));
    return;
  }
  const neg = acc < 0;
  const tc = secondsToTC(Math.abs(acc));
  const sign = neg ? "−" : "";
  history.prepend(makeHist(display.value, `${sign}${tc.hh}:${tc.mm}:${tc.ss}:${tc.ff}`));
  display.value = `${sign}${tc.hh}:${tc.mm}:${tc.ss}:${tc.ff}`;
}

function parseValue(tok) {
  if (/^(?:\d+(?:\.\d+)?\s*[hmsf]\s*)+$/i.test(tok)) return durationToSeconds(tok);
  if (/^\d+(?:\.\d+)?$/.test(tok)) return parseFloat(tok); // スカラー (×2, ÷2 など)
  return tcToSeconds(tok);
}

function makeHist(expr, result, isError) {
  const div = document.createElement("div");
  div.innerHTML = isError
    ? `<span style="color:var(--danger)">${escapeHtml(expr)} = ${escapeHtml(result)}</span>`
    : `${escapeHtml(expr)} = <b>${result}</b>`;
  div.addEventListener("click", () => { display.value = result; display.focus(); });
  return div;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function showError() {
  history.prepend(makeHist(display.value, "入力エラー", true));
}

display.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); evaluate(); }
});

renderTC(0);
</script>
</body>
</html>
